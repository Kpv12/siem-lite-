<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIEM Lite — Threat Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; color: #58a6ff; }
    header span { font-size: 12px; color: #8b949e; }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #3fb950; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* UPLOAD SECTION */
    .upload-section {
      margin: 24px 32px;
      background: #161b22;
      border: 1px dashed #30363d;
      border-radius: 8px;
      padding: 24px;
    }
    .upload-section h2 {
      font-size: 13px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .upload-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .upload-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
    .upload-field label { font-size: 12px; color: #8b949e; }
    .upload-field input[type="file"] {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
    }
    .upload-field input[type="file"]:hover { border-color: #58a6ff; }

    .btn-analyze {
      background: #1f6feb;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
    }
    .btn-analyze:hover { background: #388bfd; }
    .btn-analyze:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    .upload-status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
    }
    .upload-status.loading { color: #e3b341; }
    .upload-status.success { color: #3fb950; }
    .upload-status.error   { color: #f85149; }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #484f58;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 0 32px 24px;
    }
    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .number { font-size: 36px; font-weight: bold; }
    .stat-card .label  { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .critical .number { color: #f85149; }
    .high .number     { color: #e3b341; }
    .medium .number   { color: #58a6ff; }
    .total .number    { color: #3fb950; }

    /* TABLE */
    .section { padding: 0 32px 32px; }
    .section h2 {
      font-size: 14px; color: #8b949e;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: #161b22; color: #8b949e;
      padding: 10px 14px; text-align: left;
      border-bottom: 1px solid #30363d;
      font-weight: normal;
      text-transform: uppercase;
      font-size: 11px; letter-spacing: 0.5px;
    }
    td { padding: 10px 14px; border-bottom: 1px solid #21262d; }
    tr:hover td { background: #161b22; }

    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: bold;
    }
    .badge.CRITICAL { background:#3d1a1a; color:#f85149; border:1px solid #f85149; }
    .badge.HIGH     { background:#2d2008; color:#e3b341; border:1px solid #e3b341; }
    .badge.MEDIUM   { background:#0d1f3c; color:#58a6ff; border:1px solid #58a6ff; }

    .score-bar { display:flex; align-items:center; gap:8px; }
    .score-bar .bar { height:6px; border-radius:3px; background:#21262d; flex:1; }
    .score-bar .fill { height:100%; border-radius:3px; }

    .evidence {
      font-size: 11px; color: #8b949e;
      max-width: 400px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .loading { text-align:center; padding:40px; color:#8b949e; }
  </style>
</head>
<body>

<header>
  <div class="live-dot"></div>
  <h1>SIEM Lite</h1>
  <span>Threat Intelligence Dashboard</span>
</header>

<!-- UPLOAD SECTION -->
<div class="upload-section">
  <h2>📂 Analyze Your Log Files</h2>
  <div class="upload-row">
    <div class="upload-field">
      <label>SSH Auth Log (auth.log)</label>
      <input type="file" id="auth-log" accept=".log,.txt" />
    </div>
    <div class="upload-field">
      <label>Web Access Log (access.log)</label>
      <input type="file" id="access-log" accept=".log,.txt" />
    </div>
    <button class="btn-analyze" id="analyze-btn" onclick="analyzeLogs()">
      ⚡ Analyze
    </button>
  </div>
  <div class="upload-status" id="upload-status"></div>
  <div class="note">💡 No files? Dashboard loads with sample data automatically.</div>
</div>

<!-- STATS -->
<div class="stats" id="stats">
  <div class="loading">Loading...</div>
</div>

<!-- ALERTS TABLE -->
<div class="section">
  <h2>🚨 Active Alerts</h2>
  <table>
    <thead>
      <tr>
        <th>Severity</th>
        <th>Rule</th>
        <th>Source IP</th>
        <th>Country</th>
        <th>ISP</th>
        <th>Abuse Score</th>
        <th>Description</th>
        <th>Fired At</th>
      </tr>
    </thead>
    <tbody id="alerts-body">
      <tr><td colspan="8" class="loading">Loading alerts...</td></tr>
    </tbody>
  </table>
</div>

<script>
  function renderStats(d) {
    document.getElementById('stats').innerHTML = `
      <div class="stat-card total">
        <div class="number">${d.total_events}</div>
        <div class="label">Total Events</div>
      </div>
      <div class="stat-card total">
        <div class="number">${d.total_alerts}</div>
        <div class="label">Alerts Fired</div>
      </div>
      <div class="stat-card critical">
        <div class="number">${d.critical}</div>
        <div class="label">Critical</div>
      </div>
      <div class="stat-card high">
        <div class="number">${d.high}</div>
        <div class="label">High</div>
      </div>
      <div class="stat-card medium">
        <div class="number">${d.medium}</div>
        <div class="label">Medium</div>
      </div>
      <div class="stat-card total">
        <div class="number">${d.unique_attacker_ips}</div>
        <div class="label">Attacker IPs</div>
      </div>
    `;
  }

  function renderAlerts(alerts) {
    const tbody = document.getElementById('alerts-body');
    if (!alerts.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="loading">No alerts fired.</td></tr>';
      return;
    }
    tbody.innerHTML = alerts.map(a => {
      const score = typeof a.abuse_score === 'number' ? a.abuse_score : 0;
      const color = score > 80 ? '#f85149' : score > 40 ? '#e3b341' : '#3fb950';
      return `
        <tr>
          <td><span class="badge ${a.severity}">${a.severity}</span></td>
          <td>${a.alert}</td>
          <td style="color:#58a6ff">${a.source_ip}</td>
          <td>${a.country || 'N/A'}</td>
          <td>${a.isp || 'N/A'}</td>
          <td>
            <div class="score-bar">
              <div class="bar">
                <div class="fill" style="width:${score}%;background:${color}"></div>
              </div>
              <span style="color:${color};font-size:11px">${score}%</span>
            </div>
          </td>
          <td class="evidence" title="${a.description}">${a.description}</td>
          <td style="color:#8b949e;font-size:11px">${a.fired_at}</td>
        </tr>
      `;
    }).join('');
  }

  async function analyzeLogs() {
    const authFile   = document.getElementById('auth-log').files[0];
    const accessFile = document.getElementById('access-log').files[0];
    const status     = document.getElementById('upload-status');
    const btn        = document.getElementById('analyze-btn');

    if (!authFile && !accessFile) {
      status.className = 'upload-status error';
      status.textContent = '⚠ Please select at least one log file.';
      return;
    }

    btn.disabled = true;
    status.className = 'upload-status loading';
    status.textContent = '⏳ Uploading and analyzing... this may take a few seconds for threat intel lookups.';

    const formData = new FormData();
    if (authFile)   formData.append('auth_log', authFile);
    if (accessFile) formData.append('access_log', accessFile);

    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();

      renderStats(data.summary);
      renderAlerts(data.alerts);

      status.className = 'upload-status success';
      status.textContent = `✅ Analysis complete — ${data.summary.total_events} events parsed, ${data.summary.total_alerts} alerts fired.`;
    } catch (err) {
      status.className = 'upload-status error';
      status.textContent = '❌ Error analyzing logs. Check Flask console for details.';
    } finally {
      btn.disabled = false;
    }
  }

  // Load sample data on page load
  async function loadDefault() {
    try {
      const [sumRes, alertRes] = await Promise.all([
        fetch('/api/summary'),
        fetch('/api/alerts')
      ]);
      renderStats(await sumRes.json());
      renderAlerts(await alertRes.json());
    } catch(e) {
      console.error('Failed to load default data', e);
    }
  }

  loadDefault();
  setInterval(loadDefault, 30000);
</script>

</body>
</html>
