<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIEM Lite — Threat Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; color: #58a6ff; }
    header span { font-size: 12px; color: #8b949e; }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #3fb950; animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .number { font-size: 36px; font-weight: bold; }
    .stat-card .label { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .critical .number { color: #f85149; }
    .high .number { color: #e3b341; }
    .medium .number { color: #58a6ff; }
    .total .number { color: #3fb950; }

    .section { padding: 0 32px 32px; }
    .section h2 { font-size: 14px; color: #8b949e; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: #161b22;
      color: #8b949e;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #30363d;
      font-weight: normal;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    td { padding: 10px 14px; border-bottom: 1px solid #21262d; }
    tr:hover td { background: #161b22; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge.CRITICAL { background: #3d1a1a; color: #f85149; border: 1px solid #f85149; }
    .badge.HIGH     { background: #2d2008; color: #e3b341; border: 1px solid #e3b341; }
    .badge.MEDIUM   { background: #0d1f3c; color: #58a6ff; border: 1px solid #58a6ff; }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-bar .bar {
      height: 6px;
      border-radius: 3px;
      background: #21262d;
      flex: 1;
    }
    .score-bar .fill { height: 100%; border-radius: 3px; }

    .evidence {
      font-size: 11px;
      color: #8b949e;
      font-family: monospace;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .error { color: #f85149; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<header>
  <div class="live-dot"></div>
  <h1>SIEM Lite</h1>
  <span>Threat Intelligence Dashboard</span>
</header>

<div class="stats" id="stats">
  <div class="loading">Loading...</div>
</div>

<div class="section">
  <h2>🚨 Active Alerts</h2>
  <table>
    <thead>
      <tr>
        <th>Severity</th>
        <th>Rule</th>
        <th>Source IP</th>
        <th>Country</th>
        <th>ISP</th>
        <th>Abuse Score</th>
        <th>Description</th>
        <th>Fired At</th>
      </tr>
    </thead>
    <tbody id="alerts-body">
      <tr><td colspan="8" class="loading">Loading alerts...</td></tr>
    </tbody>
  </table>
</div>

<script>
  async function loadSummary() {
    const res = await fetch('/api/summary');
    const d = await res.json();
    document.getElementById('stats').innerHTML = `
      <div class="stat-card total">
        <div class="number">${d.total_events}</div>
        <div class="label">Total Events</div>
      </div>
      <div class="stat-card total">
        <div class="number">${d.total_alerts}</div>
        <div class="label">Alerts Fired</div>
      </div>
      <div class="stat-card critical">
        <div class="number">${d.critical}</div>
        <div class="label">Critical</div>
      </div>
      <div class="stat-card high">
        <div class="number">${d.high}</div>
        <div class="label">High</div>
      </div>
      <div class="stat-card medium">
        <div class="number">${d.medium}</div>
        <div class="label">Medium</div>
      </div>
      <div class="stat-card total">
        <div class="number">${d.unique_attacker_ips}</div>
        <div class="label">Attacker IPs</div>
      </div>
    `;
  }

  async function loadAlerts() {
    const res = await fetch('/api/alerts');
    const alerts = await res.json();
    const tbody = document.getElementById('alerts-body');
    tbody.innerHTML = alerts.map(a => {
      const score = typeof a.abuse_score === 'number' ? a.abuse_score : 0;
      const color = score > 80 ? '#f85149' : score > 40 ? '#e3b341' : '#3fb950';
      return `
        <tr>
          <td><span class="badge ${a.severity}">${a.severity}</span></td>
          <td>${a.alert}</td>
          <td style="color:#58a6ff">${a.source_ip}</td>
          <td>${a.country || 'N/A'}</td>
          <td>${a.isp || 'N/A'}</td>
          <td>
            <div class="score-bar">
              <div class="bar"><div class="fill" style="width:${score}%;background:${color}"></div></div>
              <span style="color:${color};font-size:11px">${score}%</span>
            </div>
          </td>
          <td class="evidence" title="${a.description}">${a.description}</td>
          <td style="color:#8b949e;font-size:11px">${a.fired_at}</td>
        </tr>
      `;
    }).join('');
  }

  loadSummary();
  loadAlerts();

  // Auto refresh every 30 seconds
  setInterval(() => { loadSummary(); loadAlerts(); }, 30000);
</script>

</body>
</html>
